# GitHub Actions workflow — copy this file to `.github/workflows/ci.yml`
#
# It is kept here because the automation token used for this branch is not
# allowed to write to `.github/workflows/`. Moving it there enables:
#   • build + route smoke test on every push / pull request
#   • automatic GitHub Pages deploy from main
#
#   mkdir -p .github/workflows && cp docs/ci.yml .github/workflows/ci.yml
#
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    name: Build & smoke test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Render every route (jsdom smoke test)
        run: node scripts/smoke.mjs

  deploy-pages:
    name: Deploy to GitHub Pages
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build for GitHub Pages
        run: npm run build
        env:
          VITE_BASE: /Programmer-hub/

      - name: SPA fallback for client-side routing
        run: cp dist/index.html dist/404.html

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - uses: actions/deploy-pages@v4
