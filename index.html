<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#070b18" />
    <meta name="color-scheme" content="dark light" />
    <meta
      name="description"
      content="Programmer's Hub — a modern developer marketplace to showcase your stack, publish projects and get hired fast."
    />
    <title>Programmer's Hub — Find talent. Ship projects. Get hired.</title>

    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/favicon.svg" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <!-- Canonical + per-page social tags are managed at runtime by usePageMeta. -->
    <meta property="og:image" content="/og-image.png" />
    <meta name="twitter:image" content="/og-image.png" />

    <meta property="og:site_name" content="Programmer's Hub" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Programmer's Hub — Find talent. Ship projects. Get hired." />
    <meta
      property="og:description"
      content="Showcase your stack, publish the projects you've actually shipped, and get contacted by clients in one click."
    />
    <meta name="twitter:card" content="summary" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;700&display=swap"
      rel="stylesheet"
    />

    <!--
      Apply the stored theme before first paint so a dark-mode visitor never
      sees a flash of the light palette (and vice-versa).
    -->
    <script>
      (function () {
        try {
          var stored = localStorage.getItem("ph-theme");
          var prefersLight = window.matchMedia("(prefers-color-scheme: light)").matches;
          var theme = stored === "light" || stored === "dark" ? stored : prefersLight ? "light" : "dark";
          document.documentElement.classList.toggle("dark", theme === "dark");
          document.documentElement.style.colorScheme = theme;
          var meta = document.querySelector('meta[name="theme-color"]');
          if (meta) meta.setAttribute("content", theme === "dark" ? "#070b18" : "#f7f8fc");
        } catch (error) {
          /* first paint with the default palette is fine */
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <noscript>
      <div style="max-width: 40rem; margin: 4rem auto; padding: 0 1.5rem; font-family: system-ui, sans-serif">
        <h1 style="font-size: 1.5rem">Programmer&rsquo;s Hub needs JavaScript</h1>
        <p style="line-height: 1.7; opacity: 0.75">
          This is a React single-page app — developer profiles, projects and the hiring board all render
          client-side. Please enable JavaScript, or email
          <a href="mailto:alphaluwangula@proton.me">alphaluwangula@proton.me</a> and we&rsquo;ll help.
        </p>
      </div>
    </noscript>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
